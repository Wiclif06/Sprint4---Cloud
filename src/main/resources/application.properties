spring.application.name=petjourney
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.mail.enabled=false
petjourney.bootstrap.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
petjourney.bootstrap.username=${ADMIN_USERNAME:}
petjourney.bootstrap.password=${ADMIN_PASSWORD:}
server.port=${PORT:8080}
spring.jmx.enabled=${SPRING_JMX_ENABLED:false}

# Banco de Dados PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações do JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:3}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:25}
server.tomcat.threads.min-spare=${TOMCAT_MIN_SPARE_THREADS:5}

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Configurações do Swagger/OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Segurança JWT
rsa.private-key=${RSA_PRIVATE_KEY:classpath:app.key}
rsa.public-key=${RSA_PUBLIC_KEY:classpath:app.pub}
jwt.issuer=${JWT_ISSUER:petjourney-api}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# E-mail
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SMTP_SSL:false}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_SMTP_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_SMTP_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_SMTP_WRITE_TIMEOUT:5000}
petjourney.mail.enabled=${MAIL_ENABLED:false}
petjourney.mail.provider=${MAIL_PROVIDER:smtp}
petjourney.mail.from=${MAIL_FROM:no-reply@petjourney.com}
brevo.api-key=${BREVO_API_KEY:}
brevo.api-url=${BREVO_API_URL:https://api.brevo.com/v3/smtp/email}
brevo.timeout-ms=${BREVO_TIMEOUT_MS:10000}

# Configurações de Cache
spring.cache.type=simple

# DevTools
spring.devtools.restart.enabled=${DEVTOOLS_RESTART_ENABLED:false}

